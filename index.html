<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mystic Tarot — Compliments & Jests</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <!-- Google Fonts: Cinzel Decorative, Cinzel (Tarot Titles), and Cormorant Garamond / Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;700;800&family=Outfit:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />

  <style>
    /* ==========================================================================
       Design Tokens & CSS Variables
       ========================================================================== */
    :root {
      --bg-gradient: radial-gradient(circle at 50% 18%, #100b20 0%, #080512 45%, #030208 100%);
      --bg-stars: rgba(255, 255, 255, 0.03);
      --card-bg: linear-gradient(145deg, #1d1833 0%, #120e24 100%);
      --card-back-bg: radial-gradient(circle at 50% 50%, #1c1538 0%, #0d091e 75%, #06040f 100%);
      --card-border-outer: #d4af37;
      --card-border-inner: #aa8624;
      --card-inner-bg: radial-gradient(circle at 50% 30%, rgba(212, 175, 55, 0.08) 0%, rgba(20, 16, 38, 0.7) 100%);
      --gold-primary: #f5d77f;
      --gold-deep: #c59b27;
      --gold-glow: rgba(212, 175, 55, 0.35);
      --purple-accent: #a855f7;
      --purple-glow: rgba(168, 85, 247, 0.4);
      --text-main: #fbf8ef;
      --text-muted: #b8b1cb;
      --text-gold: #f4d068;
      --deck-edge: #090712;
      --deck-border: #8b6b22;
      --modal-bg: rgba(13, 10, 26, 0.92);
      --shadow-deck: 0 30px 70px -10px rgba(0, 0, 0, 0.92), 0 14px 30px rgba(0, 0, 0, 0.8);
      --btn-grad-compliment: linear-gradient(135deg, #f5d77f 0%, #d4af37 50%, #9a781b 100%);
      --btn-grad-joke: linear-gradient(135deg, #c084fc 0%, #9333ea 50%, #6b21a8 100%);
    }

    [data-theme="light"] {
      --bg-gradient: radial-gradient(circle at 50% 20%, #fdfbf7 0%, #f3eee3 55%, #e6ddce 100%);
      --bg-stars: rgba(0, 0, 0, 0.04);
      --card-bg: linear-gradient(145deg, #ffffff 0%, #faf6ee 100%);
      --card-back-bg: radial-gradient(circle at 50% 50%, #2a2040 0%, #161026 80%, #0a0714 100%);
      --card-border-outer: #b38927;
      --card-border-inner: #926f1c;
      --card-inner-bg: radial-gradient(circle at 50% 30%, rgba(212, 175, 55, 0.12) 0%, rgba(255, 255, 255, 0.8) 100%);
      --gold-primary: #855e08;
      --gold-deep: #b38927;
      --gold-glow: rgba(179, 137, 39, 0.25);
      --purple-accent: #7e22ce;
      --purple-glow: rgba(126, 34, 206, 0.25);
      --text-main: #241d13;
      --text-muted: #6b6357;
      --text-gold: #996e10;
      --deck-edge: #ded6c5;
      --deck-border: #c4a968;
      --modal-bg: rgba(250, 246, 238, 0.94);
      --shadow-deck: 0 20px 45px -8px rgba(133, 94, 8, 0.2), 0 10px 20px rgba(0, 0, 0, 0.08);
      --btn-grad-compliment: linear-gradient(135deg, #dfb44a 0%, #b88a20 100%);
      --btn-grad-joke: linear-gradient(135deg, #9333ea 0%, #6b21a8 100%);
    }

    /* ==========================================================================
       Reset & Atmospheric Background
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      padding: 1.5rem 1rem;
      transition: background 0.5s ease, color 0.4s ease;
    }

    /* Canvas for Sparkles */
    #sparkle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 50;
    }

    /* ==========================================================================
       Celestial Sacred Geometry Background Elements
       ========================================================================== */
    .celestial-backdrop {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(900px, 95vw);
      height: min(900px, 95vw);
      pointer-events: none;
      z-index: 0;
      opacity: 0.35;
      transition: opacity 0.5s ease;
    }

    [data-theme="light"] .celestial-backdrop {
      opacity: 0.18;
    }

    .astrolabe-wheel {
      width: 100%;
      height: 100%;
      animation: slowRotate 140s linear infinite;
      transform-origin: center center;
    }

    .astrolabe-inner {
      animation: slowCounterRotate 90s linear infinite;
      transform-origin: center center;
    }

    @keyframes slowRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes slowCounterRotate {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    /* Constellation Ambient Stars */
    .ambient-star {
      position: fixed;
      border-radius: 50%;
      background: #ffffff;
      pointer-events: none;
      z-index: 0;
      animation: starTwinkle ease-in-out infinite alternate;
    }

    @keyframes starTwinkle {
      0% { opacity: 0.2; transform: scale(0.8); }
      100% { opacity: 0.85; transform: scale(1.3); }
    }

    /* ==========================================================================
       Top Navigation / Aura Controls
       ========================================================================== */
    .top-controls {
      position: fixed;
      top: 1rem;
      right: 1.25rem;
      display: flex;
      gap: 0.6rem;
      z-index: 40;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--card-border-outer);
      color: var(--text-gold);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
      transition: all 0.25s ease;
    }

    .icon-btn.muted {
      color: var(--text-muted);
      opacity: 0.6;
    }

    .icon-btn:hover {
      transform: translateY(-2px) scale(1.06);
      border-color: var(--gold-primary);
      box-shadow: 0 6px 18px var(--gold-glow);
      color: var(--text-main);
    }

    .icon-btn:active {
      transform: translateY(0);
    }

    /* ==========================================================================
       TAROT DECK & CARD STRUCTURE (3D Stack + Deal Animation)
       Aspect Ratio ~ 70mm x 120mm (Tarot Standard: ~1:1.71)
       ========================================================================== */
    .tarot-stage {
      position: relative;
      perspective: 1600px;
      z-index: 10;
      margin: 1.5rem auto 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Stacked deck underneath layers representing face-down deck */
    .deck-stack {
      position: relative;
      width: min(360px, 86vw);
      height: min(610px, 148vw);
      transform-style: preserve-3d;
      transition: transform 0.2s ease;
    }

    .deck-stack.deck-draw-recoil {
      animation: deckRecoil 0.75s cubic-bezier(0.25, 1, 0.5, 1);
    }

    @keyframes deckRecoil {
      0% { transform: translateY(0) scale(1); }
      20% { transform: translateY(3px) scale(0.995); }
      60% { transform: translateY(-1px) scale(1.002); }
      100% { transform: translateY(0) scale(1); }
    }

    .deck-layer {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      border: 1.5px solid var(--deck-border);
      pointer-events: none;
      background: var(--card-back-bg);
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.7);
      overflow: hidden;
    }

    .deck-layer-4 {
      transform: translate3d(12px, 16px, -35px) rotate(3.6deg);
      box-shadow: var(--shadow-deck);
      opacity: 0.55;
      border-color: rgba(139, 107, 34, 0.5);
    }

    .deck-layer-3 {
      transform: translate3d(8px, 12px, -24px) rotate(2.4deg);
      box-shadow: 0 25px 45px rgba(0, 0, 0, 0.75);
      opacity: 0.75;
    }

    .deck-layer-2 {
      transform: translate3d(-7px, 7px, -14px) rotate(-1.9deg);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
      opacity: 0.88;
    }

    .deck-layer-1 {
      transform: translate3d(3px, 3.5px, -6px) rotate(0.8deg);
      opacity: 0.98;
    }

    /* Top deck rim layer right underneath the active drawn card */
    .deck-layer-rim {
      transform: translate3d(0, 0, -1px);
      border-color: var(--card-border-outer);
      background: var(--card-back-bg);
      opacity: 1;
    }

    /* Detailed Back Pattern for Deck Layers */
    .deck-back-art {
      width: 100%;
      height: 100%;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .deck-back-inner {
      width: 100%;
      height: 100%;
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 12px;
      background: radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.12) 0%, transparent 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(212, 175, 55, 0.45);
    }
    .deck-back-inner svg {
      width: 65%;
      height: 65%;
      opacity: 0.65;
    }

    /* The Flip Wrapper that performs the authentic Reader's Flip */
    .tarot-flipper {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transform: rotateY(0deg);
      transition: box-shadow 0.3s ease;
    }

    /* Two-sided Card Faces */
    .card-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 20px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    /* Card Face Front: The revealed oracle */
    .card-face-front {
      background: var(--card-bg);
      padding: 14px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.6), 0 0 25px var(--gold-glow);
      transform: rotateY(0deg);
      z-index: 2;
    }

    /* Card Face Back: What a tarot deck looks like face-down */
    .card-face-back {
      background: var(--card-back-bg);
      border: 2px solid var(--card-border-outer);
      padding: 12px;
      transform: rotateY(180deg);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }

    .card-back-ornament {
      width: 100%;
      height: 100%;
      border: 1px solid var(--card-border-inner);
      border-radius: 12px;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.15) 0%, rgba(10, 7, 22, 0.8) 85%);
      position: relative;
      color: var(--gold-primary);
    }

    .back-mandala {
      width: 82%;
      height: 82%;
      opacity: 0.85;
      filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.4));
    }

    /* Authentic Tarot Reader Flip Animation:
       Picks up card from behind (face-down/back shown), lifts toward reader, rotates over 180°, and settles face-up. */
    .tarot-flipper.dealing {
      animation: tarotReaderFlip 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes tarotReaderFlip {
      0% {
        /* Starts face-down on the deck */
        transform: translate3d(0, 0, -5px) rotateY(180deg) scale(0.98);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
      }
      25% {
        /* Lifts up toward reader's gaze */
        transform: translate3d(-30px, -70px, 90px) rotate(-6deg) rotateY(135deg) scale(1.04);
        box-shadow: 0 40px 80px rgba(0, 0, 0, 0.7), 0 0 35px var(--gold-glow);
      }
      60% {
        /* Flips past 90 degrees edge-on to reveal face */
        transform: translate3d(15px, -30px, 50px) rotate(3deg) rotateY(40deg) scale(1.02);
      }
      85% {
        /* Slightly overshoots rotation before settling */
        transform: translate3d(-3px, 4px, 15px) rotate(-1deg) rotateY(-5deg) scale(1);
      }
      100% {
        /* Settles flat face-up */
        transform: translate3d(0, 0, 0) rotate(0deg) rotateY(0deg) scale(1);
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.6), 0 0 25px var(--gold-glow);
      }
    }

    /* Dual Golden Border & Geometry */
    .tarot-outer-border {
      width: 100%;
      height: 100%;
      border: 2px solid var(--card-border-outer);
      border-radius: 14px;
      padding: 8px;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .tarot-inner-border {
      width: 100%;
      height: 100%;
      border: 1px solid var(--card-border-inner);
      border-radius: 10px;
      padding: 16px 14px 14px;
      background: var(--card-inner-bg);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    /* Mystic Corner Glyphs */
    .corner-glyph {
      position: absolute;
      width: 18px;
      height: 18px;
      color: var(--card-border-outer);
      pointer-events: none;
      opacity: 0.85;
    }
    .top-left { top: 4px; left: 4px; }
    .top-right { top: 4px; right: 4px; transform: rotate(90deg); }
    .bottom-right { bottom: 4px; right: 4px; transform: rotate(180deg); }
    .bottom-left { bottom: 4px; left: 4px; transform: rotate(270deg); }

    /* ==========================================================================
       Tarot Card Content Layout
       ========================================================================== */
    .tarot-header {
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      z-index: 2;
    }

    .tarot-roman {
      font-family: 'Cinzel', serif;
      font-size: 0.95rem;
      letter-spacing: 0.3em;
      color: var(--text-gold);
      font-weight: 700;
      text-transform: uppercase;
    }

    .tarot-subheader {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }

    .tarot-line {
      height: 1px;
      flex: 1;
      background: linear-gradient(90deg, transparent, var(--card-border-inner), transparent);
    }

    .tarot-type-tag {
      font-family: 'Cinzel', serif;
      font-size: 0.68rem;
      letter-spacing: 0.22em;
      color: var(--gold-primary);
      text-transform: uppercase;
      font-weight: 600;
    }

    /* Central Mystic Window */
    .oracle-window {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 0.5rem;
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .oracle-halo {
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--gold-glow) 0%, transparent 70%);
      pointer-events: none;
      animation: pulseHalo 5s ease-in-out infinite alternate;
    }

    @keyframes pulseHalo {
      0% { opacity: 0.35; transform: scale(0.9); }
      100% { opacity: 0.75; transform: scale(1.15); }
    }

    .oracle-text-container {
      position: relative;
      z-index: 3;
      max-width: 96%;
      min-height: 160px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 0.85rem;
    }

    .oracle-title {
      font-family: 'Cinzel Decorative', 'Cinzel', serif;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--gold-primary);
      text-shadow: 0 0 14px var(--gold-glow);
      line-height: 1.35;
    }

    .oracle-message {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.25rem;
      font-weight: 500;
      line-height: 1.45;
      font-style: italic;
      color: var(--text-main);
      transition: opacity 0.25s ease;
    }

    /* Suspense Loading & Joke Punchline */
    .punchline-loading {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      color: var(--purple-accent);
      margin-top: 6px;
    }

    .loading-dot {
      width: 5px;
      height: 5px;
      background: var(--purple-accent);
      border-radius: 50%;
      animation: dotPulse 1.2s infinite ease-in-out both;
    }
    .loading-dot:nth-child(2) { animation-delay: 0.2s; }
    .loading-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotPulse {
      0%, 80%, 100% { transform: scale(0.4); opacity: 0.3; }
      40% { transform: scale(1.2); opacity: 1; }
    }

    .joke-punchline {
      margin-top: 0.4rem;
      padding: 0.65rem 0.9rem;
      border-radius: 8px;
      background: rgba(168, 85, 247, 0.12);
      border: 1px dashed var(--purple-accent);
      color: var(--gold-primary);
      font-family: 'Outfit', sans-serif;
      font-size: 0.98rem;
      font-weight: 600;
      line-height: 1.4;
      opacity: 0;
      transform: translateY(8px) scale(0.96);
      transition: all 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .joke-punchline.revealed {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* Card Utilities (Copy, Favorite) */
    .tarot-toolbar {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      width: 100%;
      margin-bottom: 0.6rem;
      z-index: 4;
    }

    .card-tool-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border-inner);
      color: var(--text-muted);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .card-tool-btn:hover {
      color: var(--text-gold);
      border-color: var(--gold-primary);
      transform: translateY(-2px);
      box-shadow: 0 4px 10px var(--gold-glow);
    }

    .card-tool-btn.liked {
      color: #ff4757;
      border-color: #ff4757;
      background: rgba(255, 71, 87, 0.15);
    }

    /* ==========================================================================
       Dual Tarot Action Buttons (Compliment vs. Joke)
       ========================================================================== */
    .tarot-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.7rem;
      width: 100%;
      z-index: 4;
    }

    .mystic-btn {
      font-family: 'Cinzel', serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.75rem 0.5rem;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
    }

    .mystic-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(255, 255, 255, 0.2), transparent);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .mystic-btn:hover::before {
      opacity: 1;
    }

    .mystic-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px var(--gold-glow);
    }

    .mystic-btn:active {
      transform: translateY(0);
    }

    .btn-compliment {
      background: var(--btn-grad-compliment);
      color: #17112c;
      border-color: var(--gold-primary);
    }

    .btn-joke {
      background: var(--btn-grad-joke);
      color: #ffffff;
      border-color: var(--purple-accent);
    }

    .btn-joke:hover {
      box-shadow: 0 6px 18px var(--purple-glow);
    }

    /* Footer Moon Phases Emblem */
    .tarot-footer {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      font-size: 0.75rem;
      color: var(--card-border-outer);
      opacity: 0.75;
      padding-top: 6px;
      z-index: 2;
    }

    /* ==========================================================================
       Modals: Favorites & Custom Card Inscription
       ========================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      width: 100%;
      max-width: 440px;
      background: var(--modal-bg);
      border: 2px solid var(--card-border-outer);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px var(--gold-glow);
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      transform: scale(0.92) translateY(12px);
      transition: transform 0.3s ease;
    }

    .modal-backdrop.active .modal-box {
      transform: scale(1) translateY(0);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border-inner);
      padding-bottom: 0.75rem;
      margin-bottom: 1rem;
    }

    .modal-title {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      letter-spacing: 0.12em;
      color: var(--text-gold);
    }

    .modal-close-btn {
      background: transparent;
      border: none;

    /* ==========================================================================
       Synthesized Tarot Card Flip & Whoosh Sound Effects (Web Audio API)
       ========================================================================== */
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playCardFlipSound() {
      if (!soundEnabled) return;
      try {
        initAudio();
        if (!audioCtx) return;

        const now = audioCtx.currentTime;

        // 1. Air whoosh / card sliding off linen deck (Filtered White Noise)
        const bufferSize = audioCtx.sampleRate * 0.35;
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }

        const whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;

        const noiseFilter = audioCtx.createBiquadFilter();
        noiseFilter.type = 'bandpass';
        noiseFilter.frequency.setValueAtTime(650, now);
        noiseFilter.frequency.exponentialRampToValueAtTime(1400, now + 0.15);
        noiseFilter.frequency.exponentialRampToValueAtTime(450, now + 0.32);
        noiseFilter.Q.setValueAtTime(1.8, now);

        const noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(0.001, now);
        noiseGain.gain.linearRampToValueAtTime(0.18, now + 0.08);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);

        whiteNoise.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(audioCtx.destination);

        whiteNoise.start(now);
        whiteNoise.stop(now + 0.34);

        // 2. Audible snap / linen card snap when turning over (mid-flip ~0.26s)
        const snapOsc = audioCtx.createOscillator();
        const snapGain = audioCtx.createGain();
        snapOsc.type = 'triangle';
        snapOsc.frequency.setValueAtTime(190, now + 0.22);
        snapOsc.frequency.exponentialRampToValueAtTime(55, now + 0.33);

        snapGain.gain.setValueAtTime(0.0001, now + 0.22);
        snapGain.gain.linearRampToValueAtTime(0.24, now + 0.23);
        snapGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.34);

        snapOsc.connect(snapGain);
        snapGain.connect(audioCtx.destination);

        snapOsc.start(now + 0.22);
        snapOsc.stop(now + 0.35);

        // 3. Subtle ethereal shimmer chime on reveal (~0.4s)
        const chimeOsc = audioCtx.createOscillator();
        const chimeGain = audioCtx.createGain();
        chimeOsc.type = 'sine';
        chimeOsc.frequency.setValueAtTime(currentMode === 'joke' ? 620 : 784, now + 0.38); // G5 / Eb5
        chimeOsc.frequency.exponentialRampToValueAtTime(currentMode === 'joke' ? 830 : 1046, now + 0.58);

        chimeGain.gain.setValueAtTime(0.0001, now + 0.38);
        chimeGain.gain.linearRampToValueAtTime(0.05, now + 0.42);
        chimeGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.7);

        chimeOsc.connect(chimeGain);
        chimeGain.connect(audioCtx.destination);

        chimeOsc.start(now + 0.38);
        chimeOsc.stop(now + 0.72);
      } catch (err) {
        // Fallback gracefully if Web Audio is blocked
      }
    }

    /* ==========================================================================
       Sparkles / Particle Canvas Animation
       ========================================================================== */
    const canvas = document.getElementById('sparkle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class SparkleParticle {
      constructor(x, y, color = 'gold') {
        this.x = x;
        this.y = y;
        this.size = Math.random() * 4 + 2;
        this.speedX = (Math.random() - 0.5) * 8;
        this.speedY = (Math.random() - 0.5) * 8 - 2;
        this.life = 1;
        this.decay = Math.random() * 0.025 + 0.015;
        this.colorType = color;
      }

      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.speedY += 0.12; // light gravity
        this.life -= this.decay;
        this.size *= 0.96;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.translate(this.x, this.y);

        if (this.colorType === 'purple') {
          ctx.fillStyle = '#c084fc';
          ctx.shadowColor = '#a855f7';
        } else {
          ctx.fillStyle = '#fde68a';
          ctx.shadowColor = '#f59e0b';
        }
        ctx.shadowBlur = 8;

        // Draw 4-point star shape
        ctx.beginPath();
        ctx.moveTo(0, -this.size);
        ctx.lineTo(this.size * 0.3, -this.size * 0.3);
        ctx.lineTo(this.size, 0);
        ctx.lineTo(this.size * 0.3, this.size * 0.3);
        ctx.lineTo(0, this.size);
        ctx.lineTo(-this.size * 0.3, this.size * 0.3);
        ctx.lineTo(-this.size, 0);
        ctx.lineTo(-this.size * 0.3, -this.size * 0.3);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }
    }

    function createSparkleBurst(x, y, count = 20, color = 'gold') {
      for (let i = 0; i < count; i++) {
        particles.push(new SparkleParticle(x, y, color));
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].life <= 0 || particles[i].size <= 0.2) {
          particles.splice(i, 1);
        }
      }
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    /* ==========================================================================
       Card Drawing: Compliment vs. Joke with 3D Flip
       ========================================================================== */
    function getRandomRoman() {
      return ROMAN_NUMERALS[Math.floor(Math.random() * ROMAN_NUMERALS.length)];
    }

    function animateCardFlip(callback) {
      // Play audio on flip initiation
      playCardFlipSound();

      // Recoil deck stack beneath to simulate physical card draw
      if (tarotDeckStack) {
        tarotDeckStack.classList.remove('deck-draw-recoil');
        void tarotDeckStack.offsetWidth;
        tarotDeckStack.classList.add('deck-draw-recoil');
      }

      mainFlipperEl.classList.remove('dealing');
      // Trigger browser reflow to reliably restart the reader flip animation
      void mainFlipperEl.offsetWidth;
      mainFlipperEl.classList.add('dealing');

      // Update card content at 420ms (when card is edge-on / past 90 degrees)
      setTimeout(() => {
        if (typeof callback === 'function') callback();
      }, 420);

      setTimeout(() => {
        mainFlipperEl.classList.remove('dealing');
        if (tarotDeckStack) tarotDeckStack.classList.remove('deck-draw-recoil');
      }, 850);
    }

    function triggerCompliment(e) {
      clearTimeout(punchlineTimer);
      currentMode = 'compliment';

      const pool = [...complimentData, ...customItems];
      let nextIdx;
      do {
        nextIdx = Math.floor(Math.random() * pool.length);
      } while (nextIdx === lastComplimentIdx && pool.length > 1);
      lastComplimentIdx = nextIdx;

      const item = pool[nextIdx];
      currentInscribedText = item.text;

      // Burst gold sparkles
      const btnRect = generateBtn.getBoundingClientRect();
      const originX = (e && e.clientX) ? e.clientX : (btnRect.left + btnRect.width / 2);
      const originY = (e && e.clientY) ? e.clientY : (btnRect.top + btnRect.height / 2);
      createSparkleBurst(originX, originY, 24, 'gold');

      punchlineContainer.innerHTML = '';

      // Flip card and swap text at mid-turn
      animateCardFlip(() => {
        tarotRomanEl.textContent = getRandomRoman();
        tarotTypeLabel.textContent = "THE COMPLIMENT";
        oracleCardTitle.textContent = `✦ ${item.title || "The Blessing"} ✦`;
        complimentTextEl.textContent = item.text;
        updateHeartState();
      });
    }

        punchlineTimer = setTimeout(() => {
          punchlineContainer.innerHTML = `
            <div class="joke-punchline" id="punchline-box">
              ${item.punchline}
            </div>
          `;
          requestAnimationFrame(() => {
            const punchBox = document.getElementById('punchline-box');
            if (punchBox) {
              punchBox.classList.add('revealed');
              createSparkleBurst(originX, originY - 80, 14, 'purple');
            }
          });
        }, 2400);
      });
    }

    function updateHeartState() {
      if (favorites.includes(currentInscribedText)) {
        favoriteBtn.classList.add('liked');
        favoriteBtn.setAttribute('title', 'Preserved in deck');
      } else {
        favoriteBtn.classList.remove('liked');
        favoriteBtn.setAttribute('title', 'Save card');
      }
    }

    /* ==========================================================================
       Toast Helper
       ========================================================================== */
    let toastTimeout;
    function showToast(msg) {
      clearTimeout(toastTimeout);
      toastMsg.textContent = msg;
      toastEl.classList.add('show');
      toastTimeout = setTimeout(() => {
        toastEl.classList.remove('show');
      }, 2400);
    }

    /* ==========================================================================
       Actions: Copy, Favorite
       ========================================================================== */
    copyBtn.addEventListener('click', () => {
      if (!currentInscribedText) return;
      const textarea = document.createElement('textarea');
      textarea.value = `✦ ${oracleCardTitle.textContent} ✦\n"${currentInscribedText}"`;
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast('Card inscription copied!');
      } catch (err) {
        showToast('Unable to copy');
      }
      document.body.removeChild(textarea);
    });

    favoriteBtn.addEventListener('click', () => {
      if (!currentInscribedText) return;
      const idx = favorites.indexOf(currentInscribedText);
      if (idx === -1) {
        favorites.push(currentInscribedText);
        showToast('Card saved to your deck!');
      } else {
        favorites.splice(idx, 1);
        showToast('Removed from saved deck');
      }
      localStorage.setItem('tarot_favorites', JSON.stringify(favorites));
      updateHeartState();
      renderFavorites();
    });

    /* ==========================================================================
       Favorites Modal Handling
       ========================================================================== */
    function renderFavorites() {
      favContainer.innerHTML = '';
      if (favorites.length === 0) {
        favContainer.innerHTML = `
          <div style="text-align: center; color: var(--text-muted); padding: 1.5rem 0; font-family: 'Cinzel', serif; font-size: 0.88rem;">
            No cards preserved yet. Click the heart on any card to save it here.
          </div>
        `;
        return;
      }

      favorites.forEach((text, i) => {
        const item = document.createElement('div');
        item.className = 'fav-item';
        item.innerHTML = `
          <div class="fav-text">"${text}"</div>
          <button class="fav-del-btn" data-index="${i}" title="Remove Card" aria-label="Remove Card">
            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/></svg>
          </button>
        `;
        favContainer.appendChild(item);
      });

      // Bind delete handlers
      favContainer.querySelectorAll('.fav-del-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const idx = parseInt(btn.getAttribute('data-index'));
          favorites.splice(idx, 1);
          localStorage.setItem('tarot_favorites', JSON.stringify(favorites));
          updateHeartState();
          renderFavorites();
          showToast('Card discarded from deck');
        });
      });
    }

    openFavBtn.addEventListener('click', () => {
      renderFavorites();
      favModal.classList.add('active');
      favModal.setAttribute('aria-hidden', 'false');
    });

    closeFavBtn.addEventListener('click', () => {
      favModal.classList.remove('active');
      favModal.setAttribute('aria-hidden', 'true');
    });

    /* ==========================================================================
       Custom Inscription Modal Handling
       ========================================================================== */
    openAddBtn.addEventListener('click', () => {
      addModal.classList.add('active');
      addModal.setAttribute('aria-hidden', 'false');
      customTitleInput.focus();
    });

    closeAddBtn.addEventListener('click', () => {
      addModal.classList.remove('active');
      addModal.setAttribute('aria-hidden', 'true');
    });

    customForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const title = customTitleInput.value.trim();
      const text = customTextInput.value.trim();

      if (!title || !text) return;

      const newItem = { title, text };
      customItems.push(newItem);
      localStorage.setItem('tarot_custom', JSON.stringify(customItems));

      customTitleInput.value = '';
      customTextInput.value = '';
      addModal.classList.remove('active');
      addModal.setAttribute('aria-hidden', 'true');
      showToast('New card inscribed into the deck!');

      // Present it immediately
      currentMode = 'compliment';
      currentInscribedText = newItem.text;
      tarotRomanEl.textContent = 'XXII';
      tarotTypeLabel.textContent = 'CUSTOM ARCANA';
      oracleCardTitle.textContent = `✦ ${newItem.title} ✦`;
      complimentTextEl.textContent = newItem.text;
      punchlineContainer.innerHTML = '';
      updateHeartState();
    });

    // Close Modals on click outside
    [favModal, addModal].forEach(modal => {
      modal.addEventListener('click', (e) => {
        if (e.target === modal) {
          modal.classList.remove('active');
          modal.setAttribute('aria-hidden', 'true');
        }
      });
    });

    /* ==========================================================================
       Dark / Light Theme Toggle
       ========================================================================== */
    function updateThemeUI(theme) {
      if (theme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
        themeIconContainer.innerHTML = '<svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
      } else {
        document.documentElement.removeAttribute('data-theme');
        themeIconContainer.innerHTML = '<svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';
      }
    }

    const savedTheme = localStorage.getItem('tarot_theme') || 'dark';
    updateThemeUI(savedTheme);

    themeToggleBtn.addEventListener('click', () => {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      const newTheme = isLight ? 'dark' : 'light';
      localStorage.setItem('tarot_theme', newTheme);
      updateThemeUI(newTheme);
    });

    /* ==========================================================================
       Event Listeners & Keyboard Navigation
       ========================================================================== */
    generateBtn.addEventListener('click', triggerCompliment);
    jokeBtn.addEventListener('click', triggerJoke);

    // Keyboard Shortcuts: Space draws Compliment, 'J' draws Joke
    window.addEventListener('keydown', (e) => {
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
      if (e.code === 'Space') {
        e.preventDefault();
        triggerCompliment();
      } else if (e.key.toLowerCase() === 'j') {
        triggerJoke();
      }
    });

    // Draw initial card on load
    triggerCompliment();
  </script>
</body>
</html>
